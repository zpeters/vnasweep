version: 2
updates:
  # One PR a week per ecosystem, instead of one PR per package.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # svelte-check 4.7 accepts typescript ^5 || ^6 only (#12 failed on 7).
      # Remove this when svelte-check supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
