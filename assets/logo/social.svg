<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<!-- vnasweep GitHub social preview (Settings → Social preview). Set in
     Avenir Next; social.png is the rendered copy. Re-render with `just logo`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2338"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- plot grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- the SWR dip across the whole card, with the min-SWR marker -->
  <path d="M -20 340 C 430 340 520 490 640 490 C 760 490 850 340 1300 340"
        fill="none" stroke="url(#trace)" stroke-width="14"
        stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="640" cy="490" r="17" fill="#0a1622" stroke="#e0245e" stroke-width="7"/>
  <circle cx="640" cy="490" r="5" fill="#e0245e"/>

  <!-- wordmark and tagline -->
  <text x="640" y="250" text-anchor="middle" font-family="Avenir Next" font-weight="700"
        font-size="132" letter-spacing="-2.5" fill="#f1f5f9">vna<tspan fill="url(#trace)">sweep</tspan></text>
  <text x="640" y="584" text-anchor="middle" font-family="Avenir Next" font-weight="500"
        font-size="34" letter-spacing="0.5" fill="#94a3b8">Calibrate a NanoVNA, sweep an antenna, compare the traces.</text>
</svg>
