<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f33"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>

  <!-- baseline grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="160" y1="300" x2="864" y2="300"/>
    <line x1="160" y1="440" x2="864" y2="440"/>
    <line x1="160" y1="580" x2="864" y2="580"/>
    <line x1="160" y1="720" x2="864" y2="720"/>
    <line x1="512" y1="180" x2="512" y2="800" stroke-opacity="0.05"/>
  </g>

  <!-- resonance dip: SWR trace with a notch -->
  <path d="M 150 388 C 372 388 372 772 512 772 C 652 772 652 388 874 388"
        fill="none" stroke="url(#curve)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- min-SWR marker -->
  <circle cx="512" cy="772" r="30" fill="#0a1622" stroke="#e0245e" stroke-width="14"/>
  <circle cx="512" cy="772" r="9" fill="#e0245e"/>
</svg>
