[package]
name = "vnasweep"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vnasweep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
