[package]
name = "vnasweep"
version = "0.1.0"
edition = "2024"
description = "Calibrate a NanoVNA, sweep an antenna's SWR, and save and overlay the traces."
license = "GPL-3.0-or-later"
repository = "https://github.com/zpeters/vnasweep"
readme = "../README.md"
keywords = ["nanovna", "vna", "swr", "antenna", "ham-radio"]
categories = ["science", "gui"]

[[bin]]
name = "vnasweep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
