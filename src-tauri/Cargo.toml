[package]
name = "vnasweep"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vnasweep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serialport = "4.7"
